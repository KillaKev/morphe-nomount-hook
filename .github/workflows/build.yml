name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the tag job attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with the Android SDK and sdkmanager (ANDROID_HOME)
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # Add your keystore as a base64 secret named KEYSTORE_BASE64 (and KS_PASS if its password
      # is not "android"). Builds signed with your key install as an update over your current one.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Signing with the key from secrets"
          else
            echo "::warning::No KEYSTORE_BASE64 secret, so this build gets a throwaway key and will not install over a build signed with your own key"
          fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: morphe-nomount-hook
          path: dist/morphe-nomount-hook.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/morphe-nomount-hook.apk
